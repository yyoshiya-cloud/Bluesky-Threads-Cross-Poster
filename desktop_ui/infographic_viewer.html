<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrossPost Web Studio - アプリ機能構成 ＆ 画面遷移図（全画面表示）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050811;
      color: #f8fafc;
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #0284c7;
      color: #e0f2fe;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 700;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-png {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: #ffffff;
      border: 1px solid #34d399;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
    }
    .btn-png:hover {
      background: linear-gradient(135deg, #047857 0%, #059669 100%);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #ffffff;
    }
    .main-container {
      width: 100%;
      max-width: 1920px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .diagram-wrapper {
      position: relative;
      width: 100%;
      max-width: 1920px;
      background: #030712;
      border-radius: 14px;
      border: 1px solid #1e293b;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(2, 132, 199, 0.15);
    }
    .diagram-img {
      width: 100%;
      height: auto;
      display: block;
    }
    .notice-bar {
      width: 100%;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 12.5px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .hint {
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="app-title">
        <span>CrossPost Web Studio</span>
        <span class="badge">全画面表示</span>
      </div>
    </div>
    <div class="actions">
      <button id="downloadPngBtn" class="btn-png">
        💾 PNG画像として保存
      </button>
      <a href="/" class="btn-secondary">
        ← アプリへ戻る
      </a>
    </div>
  </header>

  <div class="main-container">
    <div class="notice-bar">
      <div>
        <span>📌 <strong>完全日本語版 システム機能構成 ＆ 画面遷移図</strong>: 中央のメイン投稿エディタ画面に<strong>ご提供いただいた添付画像原画を最初からそのまま直接埋め込み</strong>しています。</span>
      </div>
      <div class="hint">
        ※ 「PNG画像として保存」を押すと1920×1080の高解像度PNGファイルが保存されます
      </div>
    </div>

    <div class="diagram-wrapper">
      <img id="diagramImage" src="/crosspost_system_infographic.svg" alt="CrossPost Web Studio 機能図・画面遷移図" class="diagram-img" />
    </div>
  </div>

  <script>
    // PNGダウンロード処理（1920x1080 高精度出力）
    document.getElementById('downloadPngBtn').addEventListener('click', () => {
      const img = document.getElementById('diagramImage');
      const canvas = document.createElement('canvas');
      canvas.width = 1920;
      canvas.height = 1080;
      const ctx = canvas.getContext('2d');

      const tempImg = new Image();
      tempImg.crossOrigin = 'anonymous';
      tempImg.onload = () => {
        ctx.drawImage(tempImg, 0, 0, 1920, 1080);
        const pngUrl = canvas.toDataURL('image/png', 1.0);
        const a = document.createElement('a');
        a.download = 'CrossPost_システム機能図_画面遷移図.png';
        a.href = pngUrl;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
      tempImg.src = img.src;
    });
  </script>
</body>
</html>
