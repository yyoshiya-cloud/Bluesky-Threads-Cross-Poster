<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>X (Twitter) 認可コールバック</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 28px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 18px; margin: 0 0 8px; color: #f8fafc; }
    p { font-size: 13px; color: #94a3b8; margin: 0 0 16px; line-height: 1.5; }
    .status-ok { color: #34d399; font-weight: bold; }
    .status-err { color: #f87171; font-weight: bold; }
    .close-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="spinner" class="spinner"></div>
    <h2 id="title">X 認証を処理中...</h2>
    <p id="desc">X (Twitter) からの認可レスポンスを受信してメイン画面へ連携しています。</p>
    <div id="action-area" style="display:none;">
      <button class="close-btn" onclick="window.close()">このタブを閉じる</button>
    </div>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');
      const errorDescription = urlParams.get('error_description');

      const titleEl = document.getElementById('title');
      const descEl = document.getElementById('desc');
      const spinnerEl = document.getElementById('spinner');
      const actionArea = document.getElementById('action-area');

      // 通信チャネルの準備 (BroadcastChannel + LocalStorage + postMessage)
      let bc = null;
      try {
        if ('BroadcastChannel' in window) {
          bc = new BroadcastChannel('x_oauth_channel');
        }
      } catch (e) {
        console.warn('BroadcastChannel not supported', e);
      }

      if (error) {
        spinnerEl.style.display = 'none';
        titleEl.textContent = '認可エラーが発生しました';
        titleEl.className = 'status-err';
        descEl.textContent = errorDescription || error || 'Xでの認証が拒否または中断されました。';
        actionArea.style.display = 'block';
        
        const payload = {
          type: 'X_OAUTH_ERROR',
          error: errorDescription || error,
          timestamp: Date.now()
        };

        if (bc) {
          bc.postMessage(payload);
        }
        try {
          localStorage.setItem('x_oauth_event', JSON.stringify(payload));
        } catch (e) {}

        if (window.opener) {
          window.opener.postMessage(payload, window.location.origin);
        }
        setTimeout(() => window.close(), 4000);
        return;
      }

      if (code) {
        spinnerEl.style.display = 'none';
        titleEl.textContent = '🎉 X 認証が完了しました！';
        titleEl.className = 'status-ok';
        descEl.innerHTML = 'メイン画面へ認証情報を安全に送信しました。<br>元のタブに戻って投稿を開始してください。';
        actionArea.style.display = 'block';

        const payload = {
          type: 'X_OAUTH_SUCCESS',
          code: code,
          state: state,
          timestamp: Date.now()
        };

        // 1. BroadcastChannel 経由で送信 (同一オリジンの全Chromeタブ)
        if (bc) {
          bc.postMessage(payload);
        }

        // 2. LocalStorage イベント経由で同期
        try {
          localStorage.setItem('x_oauth_event', JSON.stringify(payload));
        } catch (e) {}

        // 3. postMessage 経由で opener に送信
        if (window.opener) {
          try {
            window.opener.postMessage(payload, window.location.origin);
          } catch (e) {}
        }

        setTimeout(() => {
          window.close();
        }, 1500);
      } else {
        spinnerEl.style.display = 'none';
        titleEl.textContent = '認可コードが見つかりません';
        descEl.textContent = 'Xからのコールバックパラメータが指定されていません。';
        actionArea.style.display = 'block';
        setTimeout(() => window.close(), 3000);
      }
    })();
  </script>
</body>
</html>
